<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Labels">
<meta name="theme-color" content="#E8ECEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121716" media="(prefers-color-scheme: dark)">
<title>Label placer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@80..100,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEA; --surface:#F6F8F7; --line:#C5CECA; --text:#18201E; --muted:#56625E;
  --accent:#1F5C52; --accent-ink:#F6F8F7; --stage:#D3DAD6; --sel:#D99A2B; --chip:#E0E6E3; --guide:#D6338F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121716; --surface:#1B2220; --line:#2E3835; --text:#E3E9E6; --muted:#93A19C;
    --accent:#79C2B2; --accent-ink:#0F1513; --stage:#0C100F; --sel:#F0B54A; --chip:#232B29; --guide:#FF6FC3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121716; --surface:#1B2220; --line:#2E3835; --text:#E3E9E6; --muted:#93A19C;
  --accent:#79C2B2; --accent-ink:#0F1513; --stage:#0C100F; --sel:#F0B54A; --chip:#232B29; --guide:#FF6FC3;
  color-scheme: dark;
}
/* App shell: the page itself never scrolls, so there is nothing for the browser to pull-to-refresh or rubber-band */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;touch-action:manipulation;position:fixed;inset:0;width:100%}
/* Height follows the visual viewport (set from JS) so the keyboard shrinks the app instead of covering it */
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app > *{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
/* Vertical swipes on the chrome do nothing; only the tray (sideways) and the editor panes (up/down) scroll */
header,#stageWrap,.aspect,.gesture-hint,.row-head,.tabbar{touch-action:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 16px}
header h1{font-size:19px;font-weight:700;font-stretch:85%;margin:0;flex:1;letter-spacing:-.01em}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[hidden]{display:none}
button,label,.tile{-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
/* Kept in the layout (not display:none) so iOS Safari still opens the picker when the label is tapped */
.btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}

main{flex:1 1 0;min-height:0;display:flex;flex-direction:column;padding:0 16px 8px}
/* Takes whatever height is left; layout() fits the photo inside it */
#stageWrap{flex:1 1 0;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
#dock{flex:0 0 auto}
#app.editing #dock{display:none}
#stage{position:relative;flex:0 0 auto;width:100%;height:100%;background:var(--stage);border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* Square corners once a photo is loaded, so the preview matches the saved file edge for edge */
#stage.has-photo{border-radius:0}
/* Positioned by placePhoto(): fills the stage in Full mode, pans/zooms behind a square frame in Cover mode */
#photo{position:absolute;left:0;top:0;max-width:none;display:none;pointer-events:none}
.aspect{display:flex;justify-content:center;margin-top:8px}
.aspect[hidden]{display:none}
#stage.has-photo #photo{display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--muted)}
.empty p{margin:0;max-width:26ch}
#stage.has-photo .empty{display:none}
/* The layer covers the whole stage; let taps fall through to the empty-state button and the stage itself */
#layer{position:absolute;inset:0;pointer-events:none}
.placed{position:absolute;transform-origin:50% 50%;pointer-events:auto}
.guide{position:absolute;background:var(--guide);pointer-events:none;display:none;z-index:2}
.guide.v{top:0;bottom:0;width:1px}
.guide.h{left:0;right:0;height:1px}
.guide.show{display:block}
.placed img{display:block;width:100%;height:100%;pointer-events:none}
.placed.sel{outline:1.5px dashed var(--sel);outline-offset:3px}
.gesture-hint{flex:0 0 auto;font-size:12px;line-height:1.3;color:var(--muted);text-align:center;margin:6px 0 0}
.gesture-hint:empty,.gesture-hint[hidden]{display:none}

.panel{margin-top:8px}
.panel h2{font-size:15px;font-weight:700;margin:0}
.row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px;cursor:pointer}
.tray{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:8px 8px 4px 2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior:contain;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tile{position:relative;flex:0 0 auto;width:84px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.tile .thumb{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .thumb img{width:88%;height:88%;object-fit:contain}
.tile span{font-size:11px;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tile.add{border-style:dashed;justify-content:center;color:var(--accent);font-weight:600;font-size:13px}
.tile.add .plus{font-size:28px;line-height:1;font-weight:400}
.tile .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--text);color:var(--bg);display:none;align-items:center;justify-content:center;font-size:15px;line-height:1;border:2px solid var(--bg)}
.tray.manage .tile .x{display:flex}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.hint[hidden]{display:none}

/* Editor: takes the bottom of the app in place of the label tray; the photo re-fits into the space above it */
#editor{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:2px 16px 10px;max-height:55%;display:flex;flex-direction:column}
#editor[hidden]{display:none}
.grab{display:flex;justify-content:center;padding:4px 0 2px;cursor:pointer;touch-action:none}
.grab span{width:40px;height:5px;border-radius:3px;background:var(--line)}
.tabbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tabs{flex:1;display:flex;gap:4px;padding:3px;background:var(--chip);border-radius:10px}
.tabs button{flex:1;min-height:34px;border:0;border-radius:8px;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 4px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panes{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;touch-action:pan-y;overscroll-behavior:contain}
.pane[hidden]{display:none}
#editor.collapsed .panes{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.btn.danger{color:#B4382E}
.field{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.field label{font-size:13px;color:var(--muted);width:48px;flex:0 0 auto}
.field input[type=text]{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px;font-family:'Roboto',system-ui,sans-serif}
.range{display:grid;grid-template-columns:84px 1fr 52px;align-items:center;gap:10px;margin:6px 0}
.range label{font-size:14px}
.range output{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.range.nudge{grid-template-columns:20px 40px 1fr 40px 50px;gap:8px}
.step{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;font-weight:600;cursor:pointer;padding:0}
.choice{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;margin:8px 0}
.choice > span{font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.seg input[type=color]{width:0;height:0;opacity:0;position:absolute}
.check{display:flex;align-items:center;gap:10px;margin:4px 0;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#F08A80}}
:root[data-theme="dark"] .btn.danger{color:#F08A80}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb, var(--bg) 92%, transparent);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet-inner{max-width:760px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.sheet img{max-width:100%;max-height:70vh;border-radius:6px;-webkit-touch-callout:default}
.sheet p{margin:0;color:var(--muted);font-size:14px}
#measure{position:absolute;left:-10000px;top:0;width:10px;height:10px;overflow:hidden;visibility:hidden}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Label placer</h1>
  <label class="btn" id="changePhoto" hidden>Photo<input type="file" accept="image/*" id="photoInput2"></label>
  <button class="btn primary" id="saveBtn" disabled>Save image</button>
</header>
<main>
  <div id="stageWrap">
    <div id="stage">
      <div class="empty">
        <p>Choose a photo, then tap a label below to place it.</p>
        <label class="btn primary">Choose photo<input type="file" accept="image/*" id="photoInput"></label>
      </div>
      <img id="photo" alt="">
      <div id="layer"></div>
      <div class="guide v" id="guideV"></div>
      <div class="guide h" id="guideH"></div>
    </div>
  </div>
  <p class="gesture-hint" id="gestureHint"></p>
  <div id="dock">
  <div class="aspect" id="aspectBar" hidden>
    <div class="seg" id="aspectSeg">
      <button type="button" data-aspect="full" aria-pressed="true">Original</button>
      <button type="button" data-aspect="square" aria-pressed="false">Square cover</button>
    </div>
  </div>
  <section class="panel">
    <div class="row-head">
      <h2>Labels</h2>
      <button class="linkbtn" id="manageBtn" type="button">Edit list</button>
    </div>
    <div class="tray" id="tray"></div>
    <p class="hint" id="trayHint" hidden></p>
  </section>
  </div>
</main>

<section id="editor" hidden aria-label="Selected label">
  <div class="grab" id="sheetGrab" title="Collapse or expand"><span></span></div>
  <div class="tabbar">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="text" aria-selected="true">Text</button>
      <button type="button" role="tab" data-tab="move" aria-selected="false">Move</button>
      <button type="button" role="tab" data-tab="size" aria-selected="false">Size</button>
      <button type="button" role="tab" data-tab="color" aria-selected="false">Color</button>
      <button type="button" role="tab" data-tab="more" aria-selected="false">More</button>
    </div>
    <button class="linkbtn" id="doneBtn" type="button">Done</button>
  </div>
  <div class="panes">
    <div class="pane" data-pane="text">
      <div id="fields"></div>
      <label class="check"><input type="checkbox" id="centerLines"> Center the text lines</label>
    </div>
    <div class="pane" data-pane="move" hidden>
      <div class="range nudge"><label for="posX">X</label><button class="step" type="button" data-axis="x" data-d="-1" aria-label="Nudge left">‹</button><input type="range" id="posX" min="0" max="100" step="0.1"><button class="step" type="button" data-axis="x" data-d="1" aria-label="Nudge right">›</button><output id="posXO"></output></div>
      <div class="range nudge"><label for="posY">Y</label><button class="step" type="button" data-axis="y" data-d="-1" aria-label="Nudge up">‹</button><input type="range" id="posY" min="0" max="100" step="0.1"><button class="step" type="button" data-axis="y" data-d="1" aria-label="Nudge down">›</button><output id="posYO"></output></div>
      <p class="hint">These move freely, without snapping. The arrows nudge by 0.1%.</p>
    </div>
    <div class="pane" data-pane="size" hidden>
      <div class="range"><label for="sizeR">Size</label><input type="range" id="sizeR" min="4" max="100" step="0.5"><output id="sizeO"></output></div>
      <div class="range"><label for="rotR">Rotation</label><input type="range" id="rotR" min="-180" max="180" step="1"><output id="rotO"></output></div>
      <div class="range"><label for="txtR">Text size</label><input type="range" id="txtR" min="50" max="200" step="1"><output id="txtO"></output></div>
    </div>
    <div class="pane" data-pane="color" hidden>
      <div class="choice"><span>Ink</span>
        <div class="seg" id="inkSeg">
          <button type="button" data-ink="">Original</button>
          <button type="button" data-ink="#ffffff"><i class="dot" style="background:#fff"></i>White</button>
          <button type="button" data-ink="#000000"><i class="dot" style="background:#000"></i>Black</button>
          <button type="button" data-ink="custom" id="inkCustomBtn"><i class="dot" id="inkCustomDot" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"></i>Color<input type="color" id="inkColor" value="#1f5c52"></button>
        </div>
      </div>
      <div class="choice"><span>Fill</span>
        <div class="seg" id="bgSeg">
          <button type="button" data-bg="none">None</button>
          <button type="button" data-bg="#ffffff"><i class="dot" style="background:#fff"></i>White</button>
          <button type="button" data-bg="#000000"><i class="dot" style="background:#000"></i>Black</button>
        </div>
      </div>
    </div>
    <div class="pane" data-pane="more" hidden>
      <div class="actions">
        <button class="btn" id="dupBtn" type="button">Duplicate</button>
        <button class="btn danger" id="delBtn" type="button">Remove from photo</button>
      </div>
    </div>
  </div>
</section>
</div>

<div class="sheet" id="result" hidden>
  <div class="sheet-inner">
    <img id="resultImg" alt="Your photo with labels">
    <p id="resultHint">Press and hold the image, then choose Save to Photos.</p>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="shareBtn" type="button" hidden>Save to Photos…</button>
      <button class="btn" id="closeResult" type="button">Close</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="measure"></div>

  let best=null, bestA=0;
  for (const el of svg.querySelectorAll('circle,ellipse,rect')) {
    if (el.closest('defs,clipPath,mask,pattern,symbol,marker')) continue;
    let b; try { b = el.getBBox(); } catch(e){ continue; }
    const a = b.width*b.height; if (a > bestA) { bestA = a; best = el; }
  }
  if (!best || bestA < w*h*0.35) {
    best = document.createElementNS(NS, 'rect');
    best.setAttribute('x', x); best.setAttribute('y', y); best.setAttribute('width', w); best.setAttribute('height', h);
    best.style.fill = 'none';
    svg.insertBefore(best, svg.firstChild);
  }
  best.dataset.backing = '1';
  best.dataset.bf = best.style.fill || 'none';

  // Editable lines
  let li = 0;
  for (const t of svg.querySelectorAll('text')) {
    const spans = [...t.querySelectorAll('tspan')].filter(ts => [...ts.childNodes].some(n => n.nodeType === 3 && n.nodeValue.trim()));
    let bb; try { bb = t.getBBox(); } catch(e){ bb = {x:0, width:0}; }
    t.dataset.cx = (bb.x + bb.width/2).toFixed(3);
    const targets = spans.length ? spans : ([...t.childNodes].some(n=>n.nodeType===3 && n.nodeValue.trim()) ? [t] : []);
    for (const el of targets) { el.dataset.line = li++; el.dataset.ox = el.hasAttribute('x') ? el.getAttribute('x') : ''; }
  }

  svg.querySelectorAll('style').forEach(s => s.remove());
  for (const el of svg.querySelectorAll('[class]')) el.removeAttribute('class');
  shadow.replaceChildren();
  return { markup: new XMLSerializer().serializeToString(svg), vb: {x,y,w,h}, lineCount: li };
}

async function getPrep(tpl){
  if (prepCache.has(tpl.id)) return prepCache.get(tpl.id);
  await fontsReady;
  const p = prepare(tpl.svg);
  prepCache.set(tpl.id, p);
  return p;
}

function svgUrl(markup){ return URL.createObjectURL(new Blob([markup], {type:'image/svg+xml'})); }
function withFont(markup){ return markup.replace(/<svg\b([^>]*)>/, (m) => m + '<style>' + FONT_CSS + '</style>'); }

/* ---------- Tray ---------- */
async function renderTray(){
  tray.replaceChildren();
  tray.classList.toggle('manage', manage);
  for (const tpl of templates) {
    const b = document.createElement('button');
    b.type='button'; b.className='tile';
    b.setAttribute('aria-label', manage ? `Remove ${tpl.name} from the list` : `Add ${tpl.name} to the photo`);
    const th = document.createElement('div'); th.className='thumb';
    const im = document.createElement('img'); im.alt='';
    th.appendChild(im);
    const nm = document.createElement('span'); nm.textContent = tpl.name;
    const x = document.createElement('i'); x.className='x'; x.textContent='×'; x.setAttribute('aria-hidden','true');
    b.append(th, nm, x);
    b.addEventListener('click', () => manage ? removeTemplate(tpl) : addInstance(tpl));
    tray.appendChild(b);
    getPrep(tpl).then(p => { im.src = svgUrl(withFont(p.markup)); }).catch(() => { nm.textContent = tpl.name + ' (unreadable)'; });
  }
  const add = document.createElement('label');
  add.className='tile add';
  add.innerHTML = '<span class="plus" aria-hidden="true">+</span>Add SVGs<input type="file" accept=".svg,image/svg+xml" multiple hidden>';
  add.querySelector('input').addEventListener('change', onSvgFiles);
  tray.appendChild(add);
  $('manageBtn').textContent = manage ? 'Done' : 'Edit list';
  $('trayHint').hidden = !manage;
  $('trayHint').textContent = manage ? 'Tap a label to remove it from the list. Labels already on the photo stay.' : '';
}

async function onSvgFiles(e){
  const files = [...e.target.files]; e.target.value = '';
  let added = 0;
  for (const f of files) {
    try {
      const text = await f.text();
      const tpl = { id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: f.name.replace(/\.svg$/i,''), svg: text };
      prepCache.set(tpl.id, (await fontsReady, prepare(text)));
      templates.push(tpl); added++;
    } catch(err){ toast(`“${f.name}” isn’t a readable SVG.`); }
  }
  if (added) { saveTemplates(); manage = false; renderTray(); toast(added === 1 ? 'Label added to the list.' : `${added} labels added to the list.`); }
}

function removeTemplate(tpl){
  templates = templates.filter(t => t !== tpl);
  prepCache.delete(tpl.id);
  saveTemplates();
  if (!templates.length) manage = false;
  renderTray();
}

$('manageBtn').addEventListener('click', () => { manage = !manage; renderTray(); });

/* ---------- Instances ---------- */
async function addInstance(tpl){
  if (!stageW) { toast('Choose a photo first.'); return; }
  let p; try { p = await getPrep(tpl); } catch(e){ toast(`“${tpl.name}” isn’t a readable SVG.`); return; }
  const doc = new DOMParser().parseFromString(p.markup, 'image/svg+xml');
  const svg = document.importNode(doc.documentElement, true);
  const st = document.createElementNS(NS, 'style'); st.textContent = FONT_CSS; svg.insertBefore(st, svg.firstChild);
  const inst = makeInst(tpl.id, svg, p.vb, { x:.5, y:.5, w: Math.min(.35, .35 * stageH / stageW * (p.vb.w/p.vb.h) + .0001) || .35, rot:0, textScale:1, ink:'', bg:'none', center:false });
  instances.push(inst);
  select(inst);
}

function makeInst(tplId, svg, vb, s){
  const lines = [...svg.querySelectorAll('[data-line]')].sort((a,b) => a.dataset.line - b.dataset.line);
  const el = document.createElement('div'); el.className = 'placed';
  const img = document.createElement('img'); img.alt=''; el.appendChild(img);
  layer.appendChild(el);
  const inst = { id: Math.random().toString(36).slice(2), tplId, svg, vb, lines, el, img, url:null, ...s };
  el._inst = inst;
  position(inst); render(inst);
  return inst;
}

function applyStyles(inst){
  const svg = inst.svg;
  for (const el of svg.querySelectorAll('[data-ink-fill]')) el.style.fill = inst.ink || el.dataset.of;
  for (const el of svg.querySelectorAll('[data-ink-stroke]')) el.style.stroke = inst.ink || el.dataset.os;
  const bk = svg.querySelector('[data-backing]');
  if (bk) bk.style.fill = inst.bg === 'none' ? (bk.dataset.inkFill ? (inst.ink || bk.dataset.of) : bk.dataset.bf) : inst.bg;
  for (const el of svg.querySelectorAll('[data-fs]')) { const fs = parseFloat(el.dataset.fs); if (fs) el.style.fontSize = (fs * inst.textScale) + 'px'; }
  for (const el of inst.lines) {
    const t = el.localName === 'text' ? el : el.closest('text');
    if (inst.center && t) { el.setAttribute('x', t.dataset.cx); el.style.textAnchor = 'middle'; }
    else { if (el.dataset.ox !== '') el.setAttribute('x', el.dataset.ox); else el.removeAttribute('x'); el.style.textAnchor = el.dataset.ta || ''; }
  }
}

function markupFor(inst, w, h){
  applyStyles(inst);
  inst.svg.setAttribute('width', w); inst.svg.setAttribute('height', h);
  return new XMLSerializer().serializeToString(inst.svg);
}

function render(inst){
  const url = svgUrl(markupFor(inst, inst.vb.w, inst.vb.h));
  const old = inst.url; inst.url = url;
  inst.img.onload = () => { if (old) URL.revokeObjectURL(old); };
  inst.img.src = url;
}
let rafPending = new Set();
function scheduleRender(inst){
  if (rafPending.has(inst)) return; rafPending.add(inst);
  requestAnimationFrame(() => { rafPending.delete(inst); render(inst); });
}

function position(inst){
  const w = inst.w * stageW, h = w * inst.vb.h / inst.vb.w;
  Object.assign(inst.el.style, { left: (inst.x*stageW)+'px', top: (inst.y*stageH)+'px', width: w+'px', height: h+'px', marginLeft: (-w/2)+'px', marginTop: (-h/2)+'px', transform: `rotate(${inst.rot}deg)` });
}

function select(inst){
  const wasOpen = !editor.hidden;
  selected = inst;
  for (const i of instances) i.el.classList.toggle('sel', i === inst);
  editor.hidden = !inst;
  // The editor replaces the tray and hint while a label is selected
  $('app').classList.toggle('editing', !!inst);
  updateHint();
  if (!inst) { layout(); return; }
  if (!wasOpen) editor.classList.remove('collapsed');
  layout();
  fields.replaceChildren();
  inst.lines.forEach((el, i) => {
    const wrap = document.createElement('div'); wrap.className='field';
    const id = 'line' + i;
    const lb = document.createElement('label'); lb.htmlFor = id; lb.textContent = inst.lines.length > 1 ? `Line ${i+1}` : 'Text';
    const inp = document.createElement('input'); inp.type='text'; inp.id=id; inp.value = el.textContent.trim();
    inp.autocomplete='off'; inp.spellcheck=false; inp.setAttribute('autocorrect','off'); inp.setAttribute('autocapitalize','off');
    inp.addEventListener('input', () => { el.textContent = inp.value; scheduleRender(inst); });
    wrap.append(lb, inp); fields.appendChild(wrap);
  });
  if (!inst.lines.length) { const p = document.createElement('p'); p.className='hint'; p.textContent='This label has no editable text. Its text may have been converted to shapes.'; fields.appendChild(p); }
  syncControls();
}

function updateHint(){
  const h = $('gestureHint');
  h.hidden = !!selected;
  h.textContent = !photoImg.naturalWidth ? ''
    : instances.length ? 'Tap a label to edit. Drag to move, pinch to resize and rotate.'
    : aspect === 'square' ? 'Drag the photo to frame it, pinch to zoom. Saves 3000×3000.'
    : 'Tap a label below to add it.';
}

function syncControls(){
  const i = selected; if (!i) return;
  $('posX').value = (i.x*100).toFixed(1); $('posXO').textContent = (i.x*100).toFixed(1) + '%';
  $('posY').value = (i.y*100).toFixed(1); $('posYO').textContent = (i.y*100).toFixed(1) + '%';
  $('sizeR').value = (i.w*100).toFixed(1); $('sizeO').textContent = Math.round(i.w*100) + '%';
  $('rotR').value = Math.round(i.rot); $('rotO').textContent = Math.round(i.rot) + '°';
  $('txtR').value = Math.round(i.textScale*100); $('txtO').textContent = Math.round(i.textScale*100) + '%';
  $('centerLines').checked = i.center;
  $('centerLines').disabled = !i.lines.length;
  for (const b of $('inkSeg').querySelectorAll('button')) {
    const v = b.dataset.ink;
    const on = v === 'custom' ? (i.ink && i.ink !== '#ffffff' && i.ink !== '#000000') : v === i.ink;
    b.setAttribute('aria-pressed', on ? 'true':'false');
  }
  if (i.ink && i.ink !== '#ffffff' && i.ink !== '#000000') $('inkCustomDot').style.background = i.ink;
  for (const b of $('bgSeg').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.bg === i.bg ? 'true':'false');
}

// Manual placement: sliders and nudge arrows set the label's center directly, bypassing the snap guides
function setPos(axis, pct){
  if (!selected) return;
  selected[axis] = Math.max(0, Math.min(1, Math.round(pct*10)/1000));
  hideGuides(); position(selected); syncControls();
}
$('posX').addEventListener('input', e => setPos('x', +e.target.value));
$('posY').addEventListener('input', e => setPos('y', +e.target.value));
for (const b of editor.querySelectorAll('.step')) b.addEventListener('click', () => { if (selected) setPos(b.dataset.axis, selected[b.dataset.axis]*100 + b.dataset.d*0.1); });
$('sizeR').addEventListener('input', e => { if (!selected) return; selected.w = e.target.value/100; position(selected); syncControls(); });
$('rotR').addEventListener('input', e => { if (!selected) return; selected.rot = +e.target.value; position(selected); syncControls(); });
$('txtR').addEventListener('input', e => { if (!selected) return; selected.textScale = e.target.value/100; scheduleRender(selected); syncControls(); });
$('centerLines').addEventListener('change', e => { if (!selected) return; selected.center = e.target.checked; render(selected); });
$('inkSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !selected) return;
  if (b.dataset.ink === 'custom') { $('inkColor').click(); return; }
  selected.ink = b.dataset.ink; render(selected); syncControls();
});
$('inkColor').addEventListener('input', e => { if (!selected) return; selected.ink = e.target.value; render(selected); syncControls(); });
$('bgSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !selected) return; selected.bg = b.dataset.bg; render(selected); syncControls(); });
$('doneBtn').addEventListener('click', () => select(null));

/* ---------- Editor sheet ---------- */
for (const b of editor.querySelectorAll('.tabs button')) {
  b.addEventListener('click', () => {
    for (const t of editor.querySelectorAll('.tabs button')) t.setAttribute('aria-selected', t === b ? 'true' : 'false');
    for (const p of editor.querySelectorAll('.pane')) p.hidden = p.dataset.pane !== b.dataset.tab;
    editor.classList.remove('collapsed');
  });
}
$('sheetGrab').addEventListener('click', () => editor.classList.toggle('collapsed'));
// Re-fit the photo whenever the space left for it changes (editor opens, tab switch, keyboard, rotation)
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('stageWrap'));

// Size the app to the visual viewport so the on-screen keyboard shrinks it rather than covering the editor
if (window.visualViewport) {
  const vv = window.visualViewport, app = $('app');
  const fit = () => {
    if (Math.abs(vv.scale - 1) > 0.01) return;   // leave pinch-zoomed pages alone
    app.style.height = vv.height + 'px';
    app.style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : '';
    layout();
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
}
$('delBtn').addEventListener('click', () => {
  if (!selected) return;
  selected.el.remove(); if (selected.url) URL.revokeObjectURL(selected.url);
  instances = instances.filter(i => i !== selected); select(null);
});
$('dupBtn').addEventListener('click', () => {
  const s = selected; if (!s) return;
  const svg = s.svg.cloneNode(true);
  const inst = makeInst(s.tplId, svg, s.vb, { x: Math.min(.95, s.x + .05), y: Math.min(.95, s.y + .05), w: s.w, rot: s.rot, textScale: s.textScale, ink: s.ink, bg: s.bg, center: s.center });
  instances.push(inst); select(inst);
});

/* ---------- Photo ---------- */
function onPhoto(e){
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  photoName = (f.name || 'photo').replace(/\.[^.]+$/, '');
  const url = URL.createObjectURL(f);
  photoImg.onload = () => {
    crop = { cx: .5, cy: .5, zoom: 1 };
    stage.classList.add('has-photo'); $('changePhoto').hidden = false; $('saveBtn').disabled = false; $('aspectBar').hidden = false;
    layout(); updateHint();
  };
  photoImg.onerror = () => toast('That photo couldn’t be opened. Try a JPEG or PNG.');
  photoImg.src = url;
}
$('photoInput').addEventListener('change', onPhoto);
$('photoInput2').addEventListener('change', onPhoto);

/* ---------- Crop (Original vs. square cover art) ---------- */
const COVER_PX = 3000;             // Apple Music's minimum; above Spotify's 640
let aspect = 'full';               // 'full' | 'square'
let crop = { cx: .5, cy: .5, zoom: 1 };  // square crop: center as a fraction of the photo, zoom ≥ 1 (1 = largest square)

// The part of the photo shown in the stage, in photo pixels
function cropRect(){
  const W = photoImg.naturalWidth, H = photoImg.naturalHeight;
  if (aspect !== 'square') return { x: 0, y: 0, w: W, h: H };
  const side = Math.min(W, H) / crop.zoom;
  return { x: crop.cx*W - side/2, y: crop.cy*H - side/2, w: side, h: side };
}
function clampCrop(){
  const W = photoImg.naturalWidth, H = photoImg.naturalHeight;
  crop.zoom = Math.max(1, Math.min(5, crop.zoom));
  const side = Math.min(W, H) / crop.zoom;
  crop.cx = Math.max(side/2/W, Math.min(1 - side/2/W, crop.cx));
  crop.cy = Math.max(side/2/H, Math.min(1 - side/2/H, crop.cy));
}
function placePhoto(){
  const r = cropRect(), k = stageW / r.w;
  Object.assign(photoImg.style, { left: (-r.x*k)+'px', top: (-r.y*k)+'px', width: (photoImg.naturalWidth*k)+'px', height: (photoImg.naturalHeight*k)+'px' });
}
// Switch views while keeping every label on the same spot of the photo, at the same size
function setAspect(a){
  if (a === aspect) return;
  const before = cropRect();
  aspect = a; if (photoImg.naturalWidth) clampCrop();
  const after = cropRect();
  for (const i of instances) {
    const px = before.x + i.x*before.w, py = before.y + i.y*before.h;   // label center in photo px
    i.x = (px - after.x) / after.w; i.y = (py - after.y) / after.h;
    i.w = i.w * before.w / after.w;
  }
  for (const b of $('aspectSeg').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.aspect === a ? 'true' : 'false');
  $('saveBtn').textContent = a === 'square' ? 'Save cover' : 'Save image';
  updateHint();
  layout(); syncControls();
}
$('aspectSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setAspect(b.dataset.aspect); });

function layout(){
  if (!photoImg.naturalWidth) return;
  // Fit the photo inside whatever the stage area has left between the header and the tray/editor
  const ar = aspect === 'square' ? 1 : photoImg.naturalWidth / photoImg.naturalHeight;
  const wrap = $('stageWrap');
  const aw = wrap.clientWidth, ah = wrap.clientHeight;
  if (aw <= 0 || ah <= 0) return;
  const W = Math.min(aw, ah * ar);
  stageW = W; stageH = W / ar;
  stage.style.width = stageW + 'px'; stage.style.height = stageH + 'px';
  placePhoto();
  instances.forEach(position);
}
window.addEventListener('resize', layout);

/* ---------- Gestures ---------- */
const pts = new Map();
let g = null;
function snapshot(){
  const a = [...pts.values()];
  if (a.length >= 2) {
    const [p, q] = a;
    return { mx:(p.x+q.x)/2, my:(p.y+q.y)/2, d:Math.hypot(q.x-p.x, q.y-p.y), ang:Math.atan2(q.y-p.y, q.x-p.x) };
  }
  return { mx:a[0].x, my:a[0].y };
}
let mode = null;  // 'label': moving the selected label; 'crop': framing the photo in square view
function beginGesture(){
  if (!pts.size) { g = null; return; }
  if (mode === 'label' && selected) g = { start: snapshot(), x: selected.x, y: selected.y, w: selected.w, rot: selected.rot, n: pts.size };
  else if (mode === 'crop') g = { start: snapshot(), cx: crop.cx, cy: crop.cy, zoom: crop.zoom, n: pts.size };
  else g = null;
}

/* ---------- Smart guides (snap to the photo's center/edges and to other labels) ---------- */
const SNAP_PX = 8;
function extents(inst){
  // Half width/height, in stage px, of the box around the label after rotation
  const w = inst.w * stageW, h = w * inst.vb.h / inst.vb.w, r = inst.rot * Math.PI / 180;
  const c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
  return { hw: (c*w + s*h) / 2, hh: (s*w + c*h) / 2 };
}
function snapAxis(v, half, size, others){
  // Candidates: {at: where the label's center lands, line: where to draw the guide}
  const cands = [{ at: size/2, line: size/2 }, { at: half, line: 0 }, { at: size - half, line: size }];
  for (const o of others) cands.push({ at: o.c, line: o.c }, { at: o.c - o.h + half, line: o.c - o.h }, { at: o.c + o.h - half, line: o.c + o.h });
  let best = null;
  for (const c of cands) { const d = Math.abs(v - c.at); if (d <= SNAP_PX && (!best || d < best.d)) best = { ...c, d }; }
  return best;
}
function snapPosition(inst, px, py){
  const { hw, hh } = extents(inst);
  const ox = [], oy = [];
  for (const o of instances) { if (o === inst) continue; const e = extents(o); ox.push({ c: o.x*stageW, h: e.hw }); oy.push({ c: o.y*stageH, h: e.hh }); }
  const sx = snapAxis(px, hw, stageW, ox), sy = snapAxis(py, hh, stageH, oy);
  showGuide($('guideV'), sx && sx.line, 'left'); showGuide($('guideH'), sy && sy.line, 'top');
  return { x: sx ? sx.at : px, y: sy ? sy.at : py };
}
function showGuide(el, at, prop){
  el.classList.toggle('show', at != null);
  if (at != null) el.style[prop] = Math.round(at) + 'px';
}
function hideGuides(){ $('guideV').classList.remove('show'); $('guideH').classList.remove('show'); }
function snapAngle(a){
  // Strongest pull at 0/90/180, a lighter one at every 15°
  for (const [step, tol] of [[90, 5], [15, 2.5]]) { const n = Math.round(a / step) * step; if (Math.abs(a - n) <= tol) return n; }
  return a;
}
stage.addEventListener('pointerdown', e => {
  if (!stageW) return;
  const hit = e.target.closest('.placed');
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, hit: !!hit });
  try { stage.setPointerCapture(e.pointerId); } catch(_){}
  if (pts.size === 1) {
    if (hit) { mode = 'label'; if (hit._inst !== selected) select(hit._inst); }
    else mode = aspect === 'square' ? 'crop' : null;
  }
  beginGesture();
});
stage.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (!g || g.n !== pts.size) return;
  const s = snapshot();
  if (mode === 'crop') {
    // Fingers move the photo, so the crop center moves the opposite way
    const k = stageW / cropRect().w;   // stage px per photo px
    if (pts.size >= 2 && g.start.d > 0) crop.zoom = g.zoom * s.d / g.start.d;
    crop.cx = g.cx - (s.mx - g.start.mx) / k / photoImg.naturalWidth;
    crop.cy = g.cy - (s.my - g.start.my) / k / photoImg.naturalHeight;
    clampCrop(); placePhoto();
    return;
  }
  if (!selected) return;
  if (pts.size >= 2 && g.start.d > 0) {
    selected.w = Math.max(.03, Math.min(1.5, g.w * s.d / g.start.d));
    let rot = ((g.rot + (s.ang - g.start.ang) * 180 / Math.PI + 540) % 360) - 180;
    if (!e.altKey) rot = snapAngle(rot);
    selected.rot = rot;
  }
  let px = (g.x + (s.mx - g.start.mx) / stageW) * stageW;
  let py = (g.y + (s.my - g.start.my) / stageH) * stageH;
  if (e.altKey) hideGuides(); else ({ x: px, y: py } = snapPosition(selected, px, py));  // hold Alt/Option to drag freely
  selected.x = Math.max(0, Math.min(1, px / stageW));
  selected.y = Math.max(0, Math.min(1, py / stageH));
  position(selected); syncControls();
});
function endPointer(e){
  const p = pts.get(e.pointerId); if (!p) return;
  pts.delete(e.pointerId);
  const moved = Math.hypot(p.x - p.sx, p.y - p.sy) > 6;
  if (!pts.size && !p.hit && !moved && selected) select(null);
  if (pts.size) beginGesture(); else { g = null; mode = null; hideGuides(); }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
document.addEventListener('gesturestart', e => { if (e.target && stage.contains(e.target)) e.preventDefault(); });

/* ---------- Export ---------- */
function loadImg(url){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function buildImage(){
  const r = cropRect();
  let cw, ch;
  if (aspect === 'square') cw = ch = COVER_PX;
  else { const k = Math.min(1, Math.sqrt(16000000 / (r.w*r.h))); cw = Math.round(r.w*k); ch = Math.round(r.h*k); }
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');
  ctx.drawImage(photoImg, r.x, r.y, r.w, r.h, 0, 0, cw, ch);
  for (const inst of instances) {
    const lw = inst.w * cw, lh = lw * inst.vb.h / inst.vb.w;
    const url = svgUrl(markupFor(inst, lw, lh));
    try {
      const img = await loadImg(url);
      if (img.decode) { try { await img.decode(); } catch(_){} }
      await wait(150);
      ctx.save(); ctx.translate(inst.x*cw, inst.y*ch); ctx.rotate(inst.rot*Math.PI/180);
      ctx.drawImage(img, -lw/2, -lh/2, lw, lh); ctx.restore();
    } finally { URL.revokeObjectURL(url); }
    inst.svg.setAttribute('width', inst.vb.w); inst.svg.setAttribute('height', inst.vb.h);
  }
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.92));
}

$('saveBtn').addEventListener('click', async () => {
  if (!photoImg.naturalWidth) return;
  const btn = $('saveBtn'); btn.disabled = true; const label = btn.textContent; btn.textContent = 'Preparing…';
  let blob;
  try { blob = await buildImage(); }
  catch(e){ toast('The image couldn’t be built. Try a smaller photo.'); btn.disabled = false; btn.textContent = label; return; }
  btn.disabled = false; btn.textContent = label;
  const filename = photoName + (aspect === 'square' ? '-cover.jpg' : '-labeled.jpg');
  const cropSide = Math.round(cropRect().w);
  const sizeNote = aspect === 'square' ? ` Cover art is 3000×3000.${cropSide < COVER_PX ? ` The cropped area was ${cropSide}px, so it was enlarged.` : ''}` : '';
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); toast('Image saved.'); return; }
    catch(err){
      const code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') { toast('A save is already open. Try again in a moment.'); return; }
    }
  }
  const r = $('resultImg'); if (r.src) URL.revokeObjectURL(r.src);
  r.src = URL.createObjectURL(blob); $('result').hidden = false;
  // On iPhone the share sheet offers "Save Image" straight to Photos
  const file = new File([blob], filename, { type: 'image/jpeg' });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  $('shareBtn').hidden = !canShare;
  $('shareBtn').onclick = async () => { try { await navigator.share({ files: [file] }); } catch(_){} };
  $('resultHint').textContent = (canShare ? 'Tap Save to Photos, or press and hold the image.' : 'Press and hold the image, then choose Save to Photos.') + sizeNote;
});
$('closeResult').addEventListener('click', () => { $('result').hidden = true; });

renderTray();
</script>
